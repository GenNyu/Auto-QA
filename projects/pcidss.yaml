# Bộ đánh giá PCI DSS
# Chạy:  just run pcidss

name: PCI DSS
source: input/kb/pcidss/   # 106 file tài liệu PCI DSS
questions: 30

chatbot:
  # Trang chat và model lấy theo CHAT_URL / CHAT_MODEL trong .env.
  # Chỉ khai ở đây khi bộ này cần chạy khác với phần còn lại:
  #   model: "ENGR Test1"
  batch_size: 10

scoring:
  threshold: 6             # từ 6 điểm trở lên là ĐẠT
  deep_check: true         # đối chiếu lại tài liệu gốc khi điểm lưng chừng

llm:
  # Bỏ trống model/base_url thì lấy theo OPENAI_MODEL / OPENAI_BASE_URL trong .env
  provider: openai
